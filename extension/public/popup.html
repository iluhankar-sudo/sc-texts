<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sc texts</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div id="bg" class="bg" aria-hidden="true"></div>

<header class="track">
  <div id="art" class="art" aria-hidden="true">♪</div>
  <div class="meta">
    <div id="title" class="name">sc texts</div>
    <div id="artist" class="sub"></div>
  </div>
  <button id="toggle" class="icon" hidden></button>
  <button id="menu" class="icon ghost" data-i18n-title="settings" data-i18n-aria="settings">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
  </button>
</header>

<form id="form" class="link" autocomplete="off">
  <input id="url" type="text" inputmode="url" spellcheck="false" data-i18n-placeholder="linkPlaceholder" data-i18n-aria="linkAria">
  <button id="sound" type="button" class="mini" data-i18n-title="soundToggle" data-i18n-aria="soundToggle"></button>
  <button id="go" type="submit" class="go" data-i18n-title="recognize" data-i18n-aria="recognize">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </button>
</form>


<div id="progress" class="progress" hidden>
  <div class="bar"><i id="bar"></i></div>
  <span id="ptime">0:00 / 0:00</span>
</div>
<div class="statusRow">
  <div id="status" class="status"></div>
  <button id="correct" class="linkBtn" hidden data-i18n="correctBtn" data-i18n-title="correctBtnTitle"></button>
</div>
<main id="list" class="lyrics"></main>
<textarea id="editor" class="editor" hidden spellcheck="true"></textarea>
<div class="actions editActions" id="editActions" hidden>
  <button id="editCancel" class="share alt" data-i18n="editCancel"></button>
  <button id="editSave" class="share" data-i18n="editSave"></button>
</div>
<div class="actions">
  <button id="translate" class="share" hidden>
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h8M8 3v2M5.5 5c.8 3 2.8 5.5 5.5 6.5M10.5 5c-.7 3.3-2.8 6-6.5 7.5"/><path d="m12 21 4.5-10L21 21M13.5 17.5h6"/></svg>
    <span id="translateLabel" data-i18n="translate"></span>
  </button>
  <button id="copy" class="share" hidden>
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
    <span data-i18n="copy"></span>
    <span class="tip" id="copyTip"></span>
  </button>
  <button id="edit" class="share iconOnly tipbtn" hidden>
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.17 6.81a1 1 0 0 0-3.98-3.98L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z"/><path d="m15 5 4 4"/></svg>
    <span class="tip" id="editTip" data-i18n="editTip"></span>
  </button>
  <button id="pin" class="share iconOnly pin tipbtn" hidden>
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l-1 6 4 4v2H6v-2l4-4z"/><path d="M12 15v6"/></svg>
    <span class="tip" id="pinTip"></span>
  </button>
  <button id="karaoke" class="share iconOnly tipbtn" hidden>
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m11 7.601-5.994 8.19a1 1 0 0 0 .1 1.298l.817.818a1 1 0 0 0 1.314.087L15.09 12"/><path d="M16.5 21.174C15.5 20.5 14.372 20 13 20c-2.058 0-3.928 2.356-6 2-2.072-.356-2.775-3.369-1.5-4.5"/><circle cx="16" cy="7" r="5"/></svg>
    <span class="tip" id="karaokeTip"></span>
  </button>
</div>
<script src="popup.js"></script>
</body>
</html>
