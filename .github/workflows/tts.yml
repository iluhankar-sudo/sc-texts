# Временный workflow: синтез озвучки ролика (ветка tts-temp, будет удалена).
name: TTS (временный)
on:
  push:
    branches: [tts-temp]
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu && pip install --quiet numpy soundfile omegaconf
      - run: mkdir -p tts/out && python tts/make.py
      - name: Сохранить в ветку
        run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add tts/out && git commit -q -m "tts: озвучка" && git push origin tts-temp
