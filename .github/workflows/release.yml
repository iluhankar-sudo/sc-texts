# sc texts auto build.
# On every push to master:
#   1) proxy tests and (if the Cloudflare secrets are set) deploying it with the Groq key;
#   2) extension tests, a build WITHOUT a key (with the proxy address) and publishing the archive to Releases.
#
# One-time setup (Settings → Secrets and variables → Actions):
#   secrets:   GROQ_KEY               - Groq API key (stays on Cloudflare only)
#              GEMINI_KEY             - Gemini API key for lyrics transcription (optional, stays on Cloudflare only)
#              CLOUDFLARE_API_TOKEN   - Cloudflare token with "Edit Cloudflare Workers" permission
#              CLOUDFLARE_ACCOUNT_ID  - Cloudflare account ID
#              APP_TOKEN              - any string (optional; see proxy/README.md)
#   variable:  PROXY_URL              - proxy address (optional: taken from the deployment)
name: Build and release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  proxy:
    name: Proxy (Cloudflare Worker)
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GROQ_KEY: ${{ secrets.GROQ_KEY }}
      GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
      APP_TOKEN: ${{ secrets.APP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Proxy tests
        run: node --test proxy/test/proxy.test.js
      - name: Deploy to Cloudflare
        id: deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && env.GROQ_KEY != ''
        working-directory: proxy
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx wrangler deploy 2>&1 | tee deploy.log
          printf '%s' "$GROQ_KEY" | npx wrangler secret put GROQ_KEY
          if [ -n "$GEMINI_KEY" ]; then printf '%s' "$GEMINI_KEY" | npx wrangler secret put GEMINI_KEY; fi
          if [ -n "$APP_TOKEN" ]; then printf '%s' "$APP_TOKEN" | npx wrangler secret put APP_TOKEN; fi
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          if [ -z "$url" ]; then
            echo "::error::Cloudflare did not return the proxy URL. If the log above mentions 'register a workers.dev subdomain', open dash.cloudflare.com → Workers & Pages, create a workers.dev subdomain and re-run the build."
            exit 1
          fi
          echo "Proxy: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Proxy not deployed
        if: env.CLOUDFLARE_API_TOKEN == '' || env.GROQ_KEY == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN / GROQ_KEY secrets are not set - the proxy is not deployed (the extension will ask for its own key)."

  extension:
    name: Extension
    needs: proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: extension
        run: npm install --no-audit --no-fund
      - name: Tests
        working-directory: extension
        run: npm test
      - name: Build (no key, with the proxy address)
        working-directory: extension
        env:
          PROXY_URL: ${{ vars.PROXY_URL || needs.proxy.outputs.url }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          echo "Proxy in the build: ${PROXY_URL:-none}"
          node build.mjs
          if grep -rqE 'gsk_[A-Za-z0-9]{20,}' dist; then echo "::error::A Groq key ended up in the build"; exit 1; fi
          cd dist && zip -qr ../../sc-texts.zip . -x '*.map'
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(node -p "require('./extension/public/manifest.json').version")
          tag="v${ver}"
          notes="Download sc-texts.zip, unpack it and load the folder in chrome://extensions (Developer mode → Load unpacked). Built from ${GITHUB_SHA::7}."
          # One release per version: a new build replaces the archive in it, no build number in the title.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" sc-texts.zip --clobber
            gh release edit "$tag" --title "sc texts ${ver}" --notes "$notes" --latest
          else
            gh release create "$tag" sc-texts.zip --title "sc texts ${ver}" --notes "$notes" --latest
          fi
      - name: Remove old per-build releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName -q '.[].tagName' | grep -E -- '-build\.[0-9]+$' | while read -r t; do
            echo "deleting $t"; gh release delete "$t" --cleanup-tag -y
          done || true
