# sc texts proxy: keeps the Groq key server-side; the extension recognizes audio through it.
# The key is a secret: npx wrangler secret put GROQ_KEY (or set automatically by GitHub Actions).
name = "sc-texts-proxy"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# Models allowed through the proxy.
ALLOWED_TRANSCRIBE_MODELS = "whisper-large-v3,whisper-large-v3-turbo"
ALLOWED_CHAT_MODELS = "llama-3.3-70b-versatile,llama-3.1-8b-instant"
# Gemini models for lyrics transcription, tried in order (the next one if a model is not found).
GEMINI_MODELS = "gemini-flash-latest,gemini-2.5-flash"

# Rate limit per client address: 40 per minute (a track at x3 is ~10-15 requests).
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 40
  period = 60
